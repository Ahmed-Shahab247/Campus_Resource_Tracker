<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Dashboard - Smart Campus RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react = React;</script>
<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="common.jsx"></script>
<script type="text/babel" data-presets="react">
if (!token || role !== 'faculty') window.location.href = '/';

// Same course check used for both the queue and the room list
const sameCourse = (a, b) => Boolean(a) && Boolean(b) && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

function App() {
  const [toast, showAlert] = useToast();
  const [dept, setDept] = useState(null);
  const [bookings, setBookings] = useState(null);
  const [rooms, setRooms] = useState([]);
  const [roomId, setRoomId] = useState('');
  const [date, setDate] = useState('');
  const [locks, setLocks] = useState({});
  const [confirm, setConfirm] = useState(null);

  const loadFacultyBookings = useCallback(async () => {
    try {
      const res = await fetch('/api/bookings/faculty-bookings', { headers: authHeaders() });
      if (!res.ok) {
        if (res.status === 403) { showAlert('Unauthorized access. Faculty privileges required.'); setTimeout(handleLogout, 2000); }
        return;
      }
      const data = await res.json();
      setDept(data.department);
      // Only requests for this faculty's course (and from students of that course, when the API says so)
      setBookings(data.bookings.filter(b =>
        b.resource_id && sameCourse(b.resource_id.course, data.department) &&
        (!b.user_id || !b.user_id.course || sameCourse(b.user_id.course, data.department))));
    } catch (err) { console.error('Error loading faculty bookings:', err); showAlert('Failed to connect to server.'); }
  }, []);

  useEffect(() => { loadFacultyBookings(); }, []);

  useEffect(() => {
    if (!dept) return;
    (async () => {
      try {
        const res = await fetch('/api/resources', { headers: authHeaders() });
        const all = await res.json();
        setRooms(all.filter(r => sameCourse(r.course, dept)));
      } catch (err) { console.error('Failed to load rooms', err); }
    })();
  }, [dept]);

  useEffect(() => {
    setLocks({});
    if (!roomId || !date) return;
    let off = false;
    (async () => {
      try {
        const res = await fetch(`/api/slot-locks?resource_id=${encodeURIComponent(roomId)}&date=${encodeURIComponent(date)}`, { headers: authHeaders() });
        if (res.ok) { const list = await res.json(); if (Array.isArray(list) && !off) { const m = {}; list.forEach(o => { m[o.slot] = Boolean(o.locked); }); setLocks(m); } }
      } catch (err) { console.warn('Could not load slot locks, showing defaults', err); }
    })();
    return () => { off = true; };
  }, [roomId, date]);

  const updateStatus = async (bookingId, status) => {
    try {
      const res = await fetch(`/api/bookings/${bookingId}/status`, { method: 'PATCH', headers: authHeaders(true), body: JSON.stringify({ status }) });
      const data = await res.json();
      if (res.ok) { showAlert(`Request ${status} successfully!`, 'success'); loadFacultyBookings(); }
      else showAlert(data.message || 'Failed to update status.');
    } catch (err) { showAlert('Server communication error.'); }
  };

  const saveLock = async (slot, locked) => {
    try {
      const res = await fetch('/api/slot-locks', { method: 'PUT', headers: authHeaders(true), body: JSON.stringify({ resource_id: roomId, date, slot: slot.value, locked }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showAlert(data.error || data.message || 'Could not update slot.'); return; }
      setLocks(l => ({ ...l, [slot.value]: locked }));
      showAlert(locked ? 'Slot locked.' : 'Slot opened for students.', 'success');
    } catch (err) { showAlert('Server communication error.'); }
  };

  const selectedRoom = rooms.find(room => room._id === roomId);
  const lockExempt = isSlotLockExempt(selectedRoom, date);
  const isLocked = s => !lockExempt && (s.value in locks ? locks[s.value] : isMorning(s));
  // red -> white asks first; white -> red is automatic
  const toggle = s => (isLocked(s) ? setConfirm(s) : saveLock(s, true));
  const ready = Boolean(roomId && date);
  const items = SLOTS.map(s => { const l = isLocked(s); return { ...s, disabled: !ready || lockExempt, state: l ? 'locked' : 'open', text: !ready ? '—' : lockExempt ? 'Always open' : l ? 'Locked' : 'Open', icon: l ? 'Lock' : 'Unlock' }; });

  const count = fn => (bookings || []).filter(fn).length;
  const metrics = [
    ['wait', 'Hourglass', 'Pending approvals', count(b => b.status === 'PENDING_FACULTY' || b.status === 'PENDING_ADMIN')],
    ['ok', 'CheckCircle2', 'Approved requests', count(b => b.status === 'APPROVED')],
    ['no', 'XCircle', 'Rejected requests', count(b => b.status === 'REJECTED')]
  ];

  return (
    <Shell portal="Faculty portal" toast={toast} tag={<span className="tag">Dept: {dept || '---'}</span>}>
      <div className="page-head"><h1>Department overview</h1><p>Review requests from your course and decide which slots are open to students.</p></div>

      <div className="metrics">
        {metrics.map(([k, icon, label, n]) => { const Icon = I[icon]; return (
          <div key={k} className={`metric metric--${k}`}><Icon size={24} strokeWidth={1.25} /><span className="metric-value">{n}</span><span className="metric-label">{label}</span></div>); })}
      </div>

      <section className="panel">
        <div className="panel-head"><h2>Manage slot locks</h2><p>Slots before 1:00 PM are locked for students by default on weekdays. Weekend slots and auditorium slots are always open. Select a locked slot to open it (you'll be asked to confirm). Select an open slot to lock it again instantly.</p></div>
        <div className="form" style={{ marginBottom: 24 }}>
          <Field label="Room / facility (your course)">
            <select className="input" value={roomId} onChange={e => setRoomId(e.target.value)}>
              <option value="">Select room</option>{rooms.map(r => <option key={r._id} value={r._id}>{`${r.building} - ${r.roomNumber}`}</option>)}
            </select>
          </Field>
          <Field label="Date"><input className="input" type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
        </div>
        <SlotGrid items={items} onPick={toggle} />
        <Legend items={[['open', 'Open to students'], ['locked', 'Locked']]} />
      </section>

      <section className="panel">
        <div className="panel-head"><h2>Department approval queue</h2><p>Booking requests from students of your course, for your course's facilities.</p></div>
        {bookings === null ? <p className="muted">Loading department bookings...</p>
          : bookings.length === 0 ? <Empty icon="Inbox">No resource requests found for your course.</Empty>
          : <table className="tbl">
              <thead><tr><th>Student email</th><th>Facility</th><th>Date &amp; time</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>{bookings.map(b => (
                <tr key={b._id}>
                  <td data-label="Student email" className="full"><strong style={{ fontWeight: 500 }}>{b.user_id ? b.user_id.email : 'Unknown'}</strong></td>
                  <td data-label="Facility">{b.resource_id ? `${b.resource_id.building} - ${b.resource_id.course} (${b.resource_id.roomNumber})` : 'N/A'}</td>
                  <td data-label="Date & time"><When b={b} /></td>
                  <td data-label="Status"><StatusBadge status={b.status} /></td>
                  <td data-label="Action">{b.status === 'PENDING_FACULTY'
                    ? <div className="btn-row">
                        <button className="btn btn-sm btn-ok" onClick={() => updateStatus(b._id, 'approved')}><I.Check size={14} strokeWidth={1.75} />Approve</button>
                        <button className="btn btn-sm btn-no" onClick={() => updateStatus(b._id, 'rejected')}><I.X size={14} strokeWidth={1.75} />Reject</button>
                      </div>
                    : <span className="muted">Processed</span>}</td>
                </tr>))}</tbody>
            </table>}
      </section>

      {confirm && (
        <div className="backdrop" onClick={() => setConfirm(null)} onKeyDown={e => e.key === 'Escape' && setConfirm(null)}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="ct" onClick={e => e.stopPropagation()}>
            <I.Unlock size={24} strokeWidth={1.5} />
            <h3 id="ct">Open this slot?</h3>
            <p>{`Students will be able to request ${confirm.value} on ${date} for this room. Are you sure?`}</p>
            <div className="btn-row">
              <button className="btn btn-quiet" onClick={() => setConfirm(null)}>Cancel</button>
              <button className="btn btn-primary" autoFocus onClick={() => { const s = confirm; setConfirm(null); saveLock(s, false); }}>Yes, open it</button>
            </div>
          </div>
        </div>
      )}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
